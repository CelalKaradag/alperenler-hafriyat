name: CI

# Her push ve pull request'te: tip denetimi, build ve Playwright duman testleri.
on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.13.0'
          cache: npm

      # package-lock.json güncel olmalı (bağımlılık eklenince yerelde `npm install` çalıştırıp lock dosyasını da kaydedin)
      - run: npm ci

      - run: npm run check

      # prebuild: font kırpma, topo SVG'leri ve duyarlı görseller (prepare:assets) burada da çalışır
      - run: npm run build

      # chromium: masaüstü + Pixel 7; webkit: iPhone 13 (iOS Safari motoru)
      - run: npx playwright install --with-deps chromium webkit

      - run: npm test

      # Görsel kontrol arşivi: her sayfa × 6 genişlik tam sayfa ekran görüntüsü (karşılaştırma yok).
      # Test geçse de geçmese de yüklenir; tek artifact (zip) olarak indirilir.
      - name: Ekran görüntülerini yükle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots/
          retention-days: 14
          if-no-files-found: ignore

      # Test başarısız olursa rapor ve izler indirilebilir olsun
      - name: Test raporunu yükle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Mobil Lighthouse (lighthouserc.json): ana sayfa, /galeri/, /iletisim/. Normal (taslaksız) build
  # üzerinde, `astro preview` ile sunulan dist/ çıktısına karşı çalışır.
  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.13.0'
          cache: npm

      - run: npm ci

      - run: npm run build

      # Eşikler: performans ≥ 0.9, erişilebilirlik ≥ 0.95, en iyi uygulamalar ≥ 0.95 (hata verir).
      # SEO ≥ 0.9 yalnızca UYARI: site henüz yayında değil (site.publish.indexable=false), tüm sayfalar
      # bilerek noindex olduğundan Lighthouse "taranabilir" denetiminde puan düşürür. Yayına alınıp
      # indexable=true yapılınca lighthouserc.json içinde seo "warn" yerine "error" yapılmalıdır.
      - run: npx lhci autorun

      # Rapor (HTML + JSON) her durumda indirilebilir olsun
      - name: Lighthouse raporunu yükle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: .lighthouseci/
          include-hidden-files: true # .lighthouseci gizli klasör
          retention-days: 14