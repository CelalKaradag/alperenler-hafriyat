name: CI

# Her push ve pull request'te HIZLI kalite testi: tip denetimi + Playwright (masaüstü Chromium 1366×768
# ve Pixel 7). Görsel arşiv, WebKit (iPhone 13) ve tüm sayfalarda a11y/layout "Full QA" workflow'unda
# (.github/workflows/full-qa.yml; elle ya da haftalık).
on:
  push:
  pull_request:

# Aynı dal/PR için yeni push, eskisinin çalışmasını iptal eder
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.13.0'
          cache: npm

      # package-lock.json güncel olmalı (bağımlılık eklenince yerelde `npm install` çalıştırıp lock dosyasını da kaydedin)
      - run: npm ci

      - run: npm run check

      # Font kırpma, topo SVG'leri ve duyarlı görseller (build'ler için gerekli)
      - run: npm run prepare:assets

      # İki test sitesi (normal + PUBLIC_SHOW_DRAFTS=true) testlerden ÖNCE bir kez build edilir
      - run: node scripts/serve-for-tests.mjs --build-only

      # Hızlı modda yalnız Chromium gerekir (WebKit yalnızca Full QA'da)
      - run: npx playwright install --with-deps chromium

      # SKIP_BUILD: testler yeniden build etmez, hazır dist-test* klasörlerini önizler. 2 işçi, fullyParallel.
      - run: npm test
        env:
          SKIP_BUILD: '1'

      # Test başarısız olursa rapor ve izler indirilebilir olsun
      - name: Test raporunu yükle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Mobil Lighthouse (lighthouserc.json): ana sayfa, /galeri/, /iletisim/. Normal (taslaksız) build
  # üzerinde, `astro preview` ile sunulan dist/ çıktısına karşı çalışır.
  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.13.0'
          cache: npm

      - run: npm ci

      - run: npm run build

      # Eşikler: performans ≥ 0.9, erişilebilirlik ≥ 0.95, en iyi uygulamalar ≥ 0.95 (hata verir).
      # SEO ≥ 0.9 yalnızca UYARI: site henüz yayında değil (site.publish.indexable=false), tüm sayfalar
      # bilerek noindex olduğundan Lighthouse "taranabilir" denetiminde puan düşürür. Yayına alınıp
      # indexable=true yapılınca lighthouserc.json içinde seo "warn" yerine "error" yapılmalıdır.
      - run: npx lhci autorun

      # Rapor (HTML + JSON) her durumda indirilebilir olsun
      - name: Lighthouse raporunu yükle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: .lighthouseci/
          include-hidden-files: true # .lighthouseci gizli klasör
          retention-days: 14